<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSP with reflected-xss</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; reflected-xss block">
    <meta http-equiv="content-security-policy" content="default-src 'self'; Reflected-XSS filter">
  </head>

    <p>Both policies name reflected-xss, a directive CSP no longer defines.</p>
  </body>
