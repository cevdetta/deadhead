<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Preferred stylesheet pragma</title>
    <link rel="alternate stylesheet" href="/light.css" title="light">
    <link rel="alternate stylesheet" href="/dark.css" title="dark">
    <meta http-equiv="default-style" content="dark">
  </head>
  <body>
    <p>The meta above selects a stylesheet set nobody can switch.</p>
  </body>
</html>
