<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSP with navigate-to</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; navigate-to 'self'">
    <meta http-equiv="content-security-policy" content="default-src 'self'; Navigate-To https://example.com">
  </head>
  <body>
    <p>Both policies name navigate-to, a directive CSP no longer defines.</p>
  </body>
</html>
