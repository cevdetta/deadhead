<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Script-driven context menu</title>
  </head>
  <body>
    <p id="target" class="menuitem">Right-click me for a custom menu.</p>
    <ul id="context-menu" role="menu" hidden>
      <li role="menuitem"><button>Copy</button></li>
    </ul>
  </body>
</html>
