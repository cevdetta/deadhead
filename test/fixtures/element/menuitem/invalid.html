<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Declarative context menu</title>
  </head>
  <body>
    <p id="target">Right-click me for a custom menu.</p>
    <menu type="context" id="custom-menu">
      <menuitem label="Copy"></menuitem>
    </menu>
  </body>
</html>
