<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Text by reference</title>
  </head>
  <body>
    <svg viewBox="0 0 120 24" width="120" height="24">
      <defs>
        <text id="label">Label</text>
      </defs>
      <text x="2" y="16"><tref href="#label"></tref></text>
    </svg>
  </body>
</html>
