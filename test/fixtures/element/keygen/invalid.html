<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Certificate enrollment</title>
  </head>
  <body>
    <form action="/certs/enroll" method="post">
      <p>Generate a key in your browser.</p>
      <keygen name="key" challenge="enrollment">
      <p><button type="submit">Submit request</button></p>
    </form>
  </body>
</html>
