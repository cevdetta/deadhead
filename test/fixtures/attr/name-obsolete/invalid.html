<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Elements with stray names</title>
  </head>
  <body>
    <a href="#part" name="part">Part</a>
    <a href="#more" id="more" name="more">More</a>
    <embed src="clip.mp4" name="clip">
    <img src="cover.png" alt="Cover" name="cover">
    <select>
      <option name="red">Red</option>
    </select>
    <p>Each name above resolves nothing.</p>
  </body>
</html>
