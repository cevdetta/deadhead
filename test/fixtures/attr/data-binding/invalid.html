<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page with data hooks</title>
  </head>
  <body>
    <span datasrc="#users" datafld="name">Ada</span>
    <table datasrc="#orders">
      <tbody>
        <tr><td>Order 7</td></tr>
      </tbody>
    </table>
    <input type="text" dataformatas="text" value="Ada">
  </body>
</html>
