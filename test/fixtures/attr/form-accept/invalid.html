<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Form with a filter hint</title>
  </head>
  <body>
    <form method="post" enctype="multipart/form-data" accept="image/*">
      <label for="shot">Choose a shot</label>
      <input type="file" id="shot" name="shot">
      <button>Submit</button>
    </form>
    <p>The form above filters nothing with its hint.</p>
  </body>
</html>
