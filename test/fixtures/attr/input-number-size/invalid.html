<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Number inputs with sizing hints</title>
  </head>
  <body>
    <form action="/order">
      <input type="number" name="qty" min="0" max="100" maxlength="3">
      <input type="NUMBER" name="bulk" size="4">
    </form>
  </body>
</html>
