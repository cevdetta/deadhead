<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scripts with binding hints</title>
    <script event="click" src="run.js"></script>
    <script for="target" event="click">run();</script>
    <script for=" Window " event="onload()">run();</script>
  </head>
  <body>
    <p>Both scripts above run on load regardless of their hints.</p>
  </body>
</html>
