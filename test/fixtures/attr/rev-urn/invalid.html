<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Links with reverse and urn hints</title>
    <link href="doc.html" rel="alternate" rev="made">
    <link href="urn:example:doc" rel="alternate" urn="example:doc">
  </head>
  <body>
    <a href="doc.html" rev="made">doc</a>
    <a href="doc.html" urn="example:doc">doc</a>
    <a href="doc.html" rev="made" urn="example:doc">doc</a>
    <p>None of the links above gains behavior from its spare attributes.</p>
  </body>
</html>
