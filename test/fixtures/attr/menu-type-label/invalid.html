<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Menus with dead attributes</title>
  </head>
  <body>
    <menu type="toolbar">
      <li><button>Copy</button></li>
    </menu>
    <menu label="Edit">
      <li><button>Cut</button></li>
    </menu>
    <menu type="context" label="Tools">
      <li><button>Paste</button></li>
    </menu>
    <p>Each list above renders the same without its attributes.</p>
  </body>
</html>
